<svg width="900" height="300" viewBox="0 0 900 300"
  xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

<linearGradient id="flow" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#58a6ff"/>
  <stop offset="50%" stop-color="#bc8cff"/>
  <stop offset="100%" stop-color="#3fb950"/>
</linearGradient>

<style>
  .label {
    fill: #8b949e;
    font-family: monospace;
    font-size: 13px;
    letter-spacing: 2px;
  }

  .math {
    fill: #c9d1d9;
    font-family: monospace;
    font-size: 14px;
  }

  .node {
    fill: #0d1117;
    stroke: #58a6ff;
    stroke-width: 2;
  }

  .q {
    stroke: #58a6ff;
  }

  .k {
    stroke: #bc8cff;
  }

  .v {
    stroke: #3fb950;
  }

  .connection {
    stroke: #30363d;
    stroke-width: 1.4;
    opacity: 0.5;
  }

  .attention {
    stroke: url(#flow);
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 7 9;
    opacity: 0.25;
    animation: flow 2.4s linear infinite;
  }

  .pulse {
    animation: pulse 2s ease-in-out infinite;
  }

  .pulse2 {
    animation: pulse 2s ease-in-out .45s infinite;
  }

  .pulse3 {
    animation: pulse 2s ease-in-out .9s infinite;
  }

  @keyframes flow {
    to {
      stroke-dashoffset: -32;
    }
  }

  @keyframes pulse {
    0%, 100% {
      opacity: .35;
      filter: none;
    }

    50% {
      opacity: 1;
      filter: url(#glow);
    }
  }
</style>

  </defs>

  <!-- HEADINGS -->

<text x="65" y="35" class="label">TOKENS</text>
<text x="270" y="35" class="label">Q · K · V</text>
<text x="485" y="35" class="label">ATTENTION</text>
<text x="735" y="35" class="label">OUTPUT</text>

  <!-- INPUT TOKENS -->

  <circle cx="100" cy="85" r="9" class="node pulse"/>
  <circle cx="100" cy="130" r="9" class="node pulse2"/>
  <circle cx="100" cy="175" r="9" class="node pulse3"/>
  <circle cx="100" cy="220" r="9" class="node pulse"/>

<text x="67" y="89" class="math">x₁</text>
<text x="67" y="134" class="math">x₂</text>
<text x="67" y="179" class="math">x₃</text>
<text x="67" y="224" class="math">x₄</text>

  <!-- INPUT -> QKV -->

<path d="M110 85 C165 85 185 85 235 85"
     class="connection"/>
<path d="M110 130 C165 130 185 130 235 130"
     class="connection"/>
<path d="M110 175 C165 175 185 175 235 175"
     class="connection"/>
<path d="M110 220 C165 220 185 220 235 220"
     class="connection"/>

  <!-- Q K V NODES -->

<circle cx="275" cy="85" r="17"
       fill="#0d1117" stroke="#58a6ff" stroke-width="2"
       class="pulse"/>

<circle cx="275" cy="152" r="17"
       fill="#0d1117" stroke="#bc8cff" stroke-width="2"
       class="pulse2"/>

<circle cx="275" cy="220" r="17"
       fill="#0d1117" stroke="#3fb950" stroke-width="2"
       class="pulse3"/>

<text x="270" y="90" class="math">Q</text>
<text x="270" y="157" class="math">K</text>
<text x="270" y="225" class="math">V</text>

  <!-- PROJECTIONS -->

<text x="145" y="72" class="math">XW<tspan baseline-shift="sub">Q</tspan></text>
<text x="145" y="147" class="math">XW<tspan baseline-shift="sub">K</tspan></text>
<text x="145" y="215" class="math">XW<tspan baseline-shift="sub">V</tspan></text>

  <!-- Q/K -> ATTENTION -->

<path d="M292 85 C355 85 385 105 440 125"
     class="attention"/>

<path d="M292 152 C350 152 385 145 440 135"
     class="attention"/>

  <!-- ATTENTION MATRIX -->

<rect x="445" y="80"
     width="150" height="145"
     rx="12"
     fill="#161b22"
     stroke="#30363d"/>

  <text x="468" y="105" class="math">
    softmax
  </text>

  <text x="463" y="128" class="math">
    QKᵀ / √d
  </text>

  <!-- ATTENTION CELLS -->

  <g class="pulse">
    <rect x="468" y="150" width="17" height="17" rx="3" fill="#58a6ff" opacity=".8"/>
    <rect x="491" y="150" width="17" height="17" rx="3" fill="#58a6ff" opacity=".25"/>
    <rect x="514" y="150" width="17" height="17" rx="3" fill="#bc8cff" opacity=".55"/>
    <rect x="537" y="150" width="17" height="17" rx="3" fill="#3fb950" opacity=".3"/>
  </g>

  <g class="pulse2">
    <rect x="468" y="173" width="17" height="17" rx="3" fill="#bc8cff" opacity=".25"/>
    <rect x="491" y="173" width="17" height="17" rx="3" fill="#58a6ff" opacity=".75"/>
    <rect x="514" y="173" width="17" height="17" rx="3" fill="#3fb950" opacity=".35"/>
    <rect x="537" y="173" width="17" height="17" rx="3" fill="#bc8cff" opacity=".65"/>
  </g>

  <g class="pulse3">
    <rect x="468" y="196" width="17" height="17" rx="3" fill="#3fb950" opacity=".55"/>
    <rect x="491" y="196" width="17" height="17" rx="3" fill="#bc8cff" opacity=".3"/>
    <rect x="514" y="196" width="17" height="17" rx="3" fill="#58a6ff" opacity=".8"/>
    <rect x="537" y="196" width="17" height="17" rx="3" fill="#3fb950" opacity=".25"/>
  </g>

  <!-- V -> ATTENTION -->

<path d="M292 220 C350 245 400 245 445 205"
     class="attention"/>

  <!-- ATTENTION -> OUTPUT -->

<path d="M595 150 C645 150 670 150 715 150"
     class="attention"/>

  <!-- OUTPUT NODES -->

  <circle cx="760" cy="85" r="9" class="node pulse"/>
  <circle cx="760" cy="130" r="9" class="node pulse2"/>
  <circle cx="760" cy="175" r="9" class="node pulse3"/>
  <circle cx="760" cy="220" r="9" class="node pulse"/>

<path d="M715 150 C730 120 735 100 750 88"
     class="connection"/>
<path d="M715 150 C735 140 740 135 750 132"
     class="connection"/>
<path d="M715 150 C735 160 740 170 750 173"
     class="connection"/>
<path d="M715 150 C730 185 735 205 750 217"
     class="connection"/>

  <!-- MOVING ACTIVATION -->

  <circle r="4" fill="#58a6ff" filter="url(#glow)">
    <animateMotion
      dur="2.5s"
      repeatCount="indefinite"
      path="M110 130 C170 130 195 130 235 130"/>
  </circle>

  <circle r="4" fill="#bc8cff" filter="url(#glow)">
    <animateMotion
      dur="2.8s"
      begin=".5s"
      repeatCount="indefinite"
      path="M292 85 C355 85 385 105 440 125"/>
  </circle>

  <circle r="4" fill="#3fb950" filter="url(#glow)">
    <animateMotion
      dur="2.4s"
      begin="1s"
      repeatCount="indefinite"
      path="M595 150 C645 150 680 150 715 150"/>
  </circle>

  <!-- EQUATION -->

  <text x="300" y="275" class="math">
    Attention(Q,K,V) = softmax(QKᵀ / √dₖ)V
  </text>

</svg>
